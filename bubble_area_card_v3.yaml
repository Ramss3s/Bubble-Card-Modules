            color: #f87171 !important;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.45) !important;
            font-weight: 600 !important;
            font-size: 11px !important;
          }

          .bac-sub-moisture {
            color: #38bdf8 !important;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.45) !important;
            font-weight: 600 !important;
            font-size: 11px !important;
          }

          .bac-sub-motion {
            color: #fbbf24 !important;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.45) !important;
            font-weight: 600 !important;
            font-size: 11px !important;
          }

          .bac-sub-air_quality {
            color: #c084fc !important;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.45) !important;
            font-weight: 600 !important;
            font-size: 11px !important;
          }

          .bac-sub-door,
          .bac-sub-window {
            color: #fcd34d !important;
            text-shadow: 0 0 8px rgba(252, 211, 77, 0.40) !important;
            font-weight: 600 !important;
            font-size: 11px !important;
          }

          .bac-sub-battery {
            color: #fbbf24 !important;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.40) !important;
            font-weight: 600 !important;
            font-size: 11px !important;
          }
          .bac-sub-battery.bac-sub-critical {
            color: #f87171 !important;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.45) !important;
          }

          .bac-sub-sep {
            margin: 0 3px !important;
            opacity: 0.5 !important;
          }

          /* Floating Bottom Progress Bar / Interactive Slider Zone */
          .bac-edge-progress-container {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            height: 26px !important;
            background: transparent !important;
            border-radius: 0 0 ${borderRadius} ${borderRadius} !important;
            z-index: 10 !important;
            pointer-events: auto !important;
            cursor: ew-resize !important;
            touch-action: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
          }

          .bac-edge-dragging .bac-edge-progress-fill {
            transition: none !important;
          }

          .bac-edge-track-wrapper {
            position: absolute !important;
            left: 16% !important;
            right: 16% !important;
            transition: all 0.44s cubic-bezier(0.34, 1.45, 0.64, 1), opacity 0.35s ease !important;
            pointer-events: none !important;
          }

          /* Single Bar Slot */
          .bac-track-slot-single {
            bottom: 10px !important;
            top: auto !important;
            transform: none !important;
            opacity: 1 !important;
          }
          .bac-track-slot-single .bac-edge-progress-track {
            height: ${edgeBarHeight} !important;
          }

          .bac-edge-progress-track {
            width: 100% !important;
            background: rgba(255, 255, 255, 0.12) !important;
            position: relative !important;
            border-radius: 3px !important;
            transition: height 0.44s cubic-bezier(0.34, 1.45, 0.64, 1) !important;
          }

          .bac-edge-progress-fill {
            height: 100% !important;
            position: relative !important;
            border-radius: 3px !important;
            transition: width 0.3s ease !important;
          }

          .bac-edge-type-lights .bac-edge-progress-fill,
          .bac-edge-fill-lights {
            background: linear-gradient(90deg, rgba(${glowRgb}, 0.35) 0%, rgb(${glowRgb}) 100%) !important;
            box-shadow: 0 0 8px rgba(${glowRgb}, 0.60) !important;
          }

          .bac-edge-type-media .bac-edge-progress-fill,
          .bac-edge-fill-media {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.35) 0%, #38bdf8 100%) !important;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.60) !important;
          }

          /* Slider Handle Thumb: Hidden by default in resting state, reveals on hover or sliding */
          .bac-edge-type-lights .bac-edge-progress-fill::after,
          .bac-edge-fill-lights::after {
            content: '' !important;
            position: absolute !important;
            right: -3px !important;
            top: 50% !important;
            transform: translateY(-50%) scale(0) !important;
            opacity: 0 !important;
            width: 6px !important;
            height: 6px !important;
            border-radius: 50% !important;
            background: #ffe082 !important;
            box-shadow: 0 0 6px rgb(${glowRgb}), 0 0 2px #ffffff !important;
            transition: transform 0.28s cubic-bezier(0.34, 1.45, 0.64, 1), opacity 0.22s ease !important;
            pointer-events: none !important;
          }

          .bac-edge-type-media .bac-edge-progress-fill::after,
          .bac-edge-fill-media::after {
            content: '' !important;
            position: absolute !important;
            right: -3px !important;
            top: 50% !important;
            transform: translateY(-50%) scale(0) !important;
            opacity: 0 !important;
            width: 6px !important;
            height: 6px !important;
            border-radius: 50% !important;
            background: #e0f2fe !important;
            box-shadow: 0 0 6px #38bdf8, 0 0 2px #ffffff !important;
            transition: transform 0.28s cubic-bezier(0.34, 1.45, 0.64, 1), opacity 0.22s ease !important;
            pointer-events: none !important;
          }

          /* Reveal handle smoothly on card hover, slider container hover, touch, or active slide */
          .bubble-button-card-container:hover .bac-edge-progress-fill::after,
          .bac-edge-progress-container:hover .bac-edge-progress-fill::after,
          .bac-edge-active .bac-edge-progress-fill::after,
          .bac-edge-dragging .bac-edge-progress-fill::after {
            opacity: 1 !important;
            transform: translateY(-50%) scale(1) !important;
          }

          /* Dynamic Color Temperature (Kelvin Scale) for Lighting */
          .bac-edge-kelvin-dim .bac-edge-progress-fill,
          .bac-edge-fill-lights.bac-edge-kelvin-dim {
            background: linear-gradient(90deg, #9a3412 0%, #d97706 70%, #f59e0b 100%) !important;
            box-shadow: 0 0 7px rgba(217, 119, 6, 0.50) !important;
          }
          .bac-edge-kelvin-dim .bac-edge-progress-fill::after,
          .bac-edge-fill-lights.bac-edge-kelvin-dim::after {
            background: #fed7aa !important;
            box-shadow: 0 0 6px #d97706, 0 0 2px #ffffff !important;
          }

          .bac-edge-kelvin-warm .bac-edge-progress-fill,
          .bac-edge-fill-lights.bac-edge-kelvin-warm {
            background: linear-gradient(90deg, #d97706 0%, #f59e0b 60%, #fbbf24 100%) !important;
            box-shadow: 0 0 9px rgba(245, 158, 11, 0.60) !important;
          }
          .bac-edge-kelvin-warm .bac-edge-progress-fill::after,
          .bac-edge-fill-lights.bac-edge-kelvin-warm::after {
            background: #fef08a !important;
            box-shadow: 0 0 6px #f59e0b, 0 0 2px #ffffff !important;
          }

          .bac-edge-kelvin-bright .bac-edge-progress-fill,
          .bac-edge-fill-lights.bac-edge-kelvin-bright {
            background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 50%, #fef08a 100%) !important;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.75) !important;
          }
          .bac-edge-kelvin-bright .bac-edge-progress-fill::after,
          .bac-edge-fill-lights.bac-edge-kelvin-bright::after {
            background: #ffffff !important;
            box-shadow: 0 0 7px #fbbf24, 0 0 3px #ffffff !important;
          }

          /* Media Paused State on Edge Bar */
          .bac-edge-media-paused,
          .bac-edge-fill-media.bac-edge-media-paused {
            opacity: 0.70 !important;
          }
          .bac-edge-media-paused .bac-edge-progress-fill,
          .bac-edge-fill-media.bac-edge-media-paused {
            background: linear-gradient(90deg, #334155 0%, #0369a1 100%) !important;
            box-shadow: 0 0 5px rgba(3, 105, 161, 0.35) !important;
          }
          .bac-edge-media-paused .bac-edge-progress-fill::after,
          .bac-edge-fill-media.bac-edge-media-paused::after {
            background: #94a3b8 !important;
            box-shadow: 0 0 4px #0369a1 !important;
            opacity: 0.65 !important;
          }

          /* Dual Edge Bar Container & Magnetic Orbit Swap Animation */
          .bac-edge-dual {
            /* Inherits position, bottom 0, left 0, right 0, height 28px from .bac-edge-progress-container */
          }

          .bac-edge-dual .bac-edge-progress-track {
            background: rgba(255, 255, 255, 0.10) !important;
          }

          /* Media Primary Slot (Default when both active) */
          .bac-dual-active-media .bac-track-slot-media {
            bottom: 12px !important;
            top: auto !important;
            left: 16% !important;
            right: 16% !important;
            transform: none !important;
            opacity: 1 !important;
            z-index: 3 !important;
          }
          .bac-dual-active-media .bac-track-slot-media .bac-edge-progress-track {
            height: ${edgeBarHeight} !important;
          }
          .bac-dual-active-media .bac-track-slot-media .bac-edge-progress-fill::after {
            display: block !important;
          }

          /* Inactive Lights Accent at Bottom Edge (Full aesthetic line) */
          .bac-dual-active-media .bac-track-slot-lights {
            top: auto !important;
            bottom: 0px !important;
            left: 12% !important;
            right: 12% !important;
            transform: none !important;
            opacity: 0.85 !important;
            z-index: 2 !important;
          }
          .bac-dual-active-media .bac-track-slot-lights .bac-edge-progress-track {
            height: 2px !important;
            background: transparent !important;
          }
          .bac-dual-active-media .bac-track-slot-lights .bac-edge-progress-fill {
            width: 100% !important;
            border-radius: 2px !important;
          }
          .bac-dual-active-media .bac-track-slot-lights .bac-edge-progress-fill::after {
            display: none !important;
            opacity: 0 !important;
          }

          /* Lights Primary Slot (After tap swap) */
          .bac-dual-active-lights .bac-track-slot-lights {
            bottom: 12px !important;
            top: auto !important;
            left: 16% !important;
            right: 16% !important;
            transform: none !important;
            opacity: 1 !important;
            z-index: 3 !important;
          }
          .bac-dual-active-lights .bac-track-slot-lights .bac-edge-progress-track {
            height: ${edgeBarHeight} !important;
          }
          .bac-dual-active-lights .bac-track-slot-lights .bac-edge-progress-fill::after {
            display: block !important;
          }

          /* Inactive Media Accent at Bottom Edge (Full aesthetic line) */
          .bac-dual-active-lights .bac-track-slot-media {
            top: auto !important;
            bottom: 0px !important;
            left: 12% !important;
            right: 12% !important;
            transform: none !important;
            opacity: 0.85 !important;
            z-index: 2 !important;
          }
          .bac-dual-active-lights .bac-track-slot-media .bac-edge-progress-track {
            height: 2px !important;
            background: transparent !important;
          }
          .bac-dual-active-lights .bac-track-slot-media .bac-edge-progress-fill {
            width: 100% !important;
            border-radius: 2px !important;
          }
          .bac-dual-active-lights .bac-track-slot-media .bac-edge-progress-fill::after {
            display: none !important;
            opacity: 0 !important;
          }

          /* Swap Feedback Tooltip Pill */
          .bac-edge-swap-tooltip {
            position: absolute !important;
            top: -24px !important;
            left: 50% !important;
            transform: translateX(-50%) translateY(4px) scale(0.85) !important;
            background: rgba(15, 23, 42, 0.92) !important;
            border: 1px solid rgba(255, 255, 255, 0.18) !important;
            color: #f8fafc !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            padding: 2px 9px !important;
            border-radius: 12px !important;
            white-space: nowrap !important;
            pointer-events: none !important;
            opacity: 0 !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            z-index: 12 !important;
          }

          .bac-edge-swap-tooltip.bac-tip-show {
            opacity: 1 !important;
            transform: translateX(-50%) translateY(0) scale(1) !important;
          }

          /* Corner Acoustic Waves (Only when media is active) */
          .bac-media-surround-waves {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: ${borderRadius} !important;
            overflow: hidden !important;
            pointer-events: none !important;
            opacity: ${waveOpacity} !important;
            transition: opacity 0.3s ease !important;
            z-index: 3 !important;
          }

          /* Color palette presets for filled circles & outline */
          .bac-waves-subtle_cyan,
          .bac-waves-soft_cyan {
            --bac-wave-fill: rgba(56, 189, 248, 0.42);
            --bac-wave-fill-soft: rgba(56, 189, 248, 0.14);
            --bac-wave-color: rgba(56, 189, 248, 0.55);
          }

          .bac-waves-subtle_slate {
            --bac-wave-fill: rgba(148, 163, 184, 0.38);
            --bac-wave-fill-soft: rgba(148, 163, 184, 0.12);
            --bac-wave-color: rgba(148, 163, 184, 0.50);
          }

          .bac-waves-warm_amber {
            --bac-wave-fill: rgba(251, 191, 36, 0.40);
            --bac-wave-fill-soft: rgba(251, 191, 36, 0.14);
            --bac-wave-color: rgba(251, 191, 36, 0.55);
          }

          .bac-waves-synth_violet {
            --bac-wave-fill: rgba(168, 85, 247, 0.40);
            --bac-wave-fill-soft: rgba(168, 85, 247, 0.14);
            --bac-wave-color: rgba(168, 85, 247, 0.55);
          }

          .bac-waves-soft_white {
            --bac-wave-fill: rgba(255, 255, 255, 0.28);
            --bac-wave-fill-soft: rgba(255, 255, 255, 0.08);
            --bac-wave-color: rgba(255, 255, 255, 0.35);
          }

          .bac-corner-unit {
            position: absolute !important;
            width: 65px !important;
            height: 65px !important;
            overflow: hidden !important;
            pointer-events: none !important;
          }

          .bac-corner-tl {
            top: 0 !important;
            left: 0 !important;
            border-top-left-radius: ${borderRadius} !important;
          }

          .bac-corner-tr {
            top: 0 !important;
            right: 0 !important;
            border-top-right-radius: ${borderRadius} !important;
          }

          .bac-corner-bl {
            bottom: 0 !important;
            left: 0 !important;
            border-bottom-left-radius: ${borderRadius} !important;
          }

          .bac-corner-br {
            bottom: 0 !important;
            right: 0 !important;
            border-bottom-right-radius: ${borderRadius} !important;
          }

          .bac-corner-unit .bac-wave {
            position: absolute !important;
            width: 110px !important;
            height: 110px !important;
            border-radius: 50% !important;
            box-sizing: border-box !important;
            transform-origin: center center !important;
            pointer-events: none !important;
            animation: bac-corner-acoustic ${waveDuration} linear infinite both !important;
          }

          /* Mode 1: Filled Overlapping Color Circles */
          .bac-waves-filled .bac-wave {
            border: 1px solid var(--bac-wave-color, rgba(56, 189, 248, 0.50)) !important;
            background: radial-gradient(circle at center, var(--bac-wave-fill, rgba(56, 189, 248, 0.42)) 0%, var(--bac-wave-fill-soft, rgba(56, 189, 248, 0.14)) 65%, transparent 100%) !important;
          }

          /* Mode 2: Thin Line Outlines */
          .bac-waves-outline .bac-wave {
            border: 1.2px solid var(--bac-wave-color, rgba(56, 189, 248, 0.50)) !important;
            background: transparent !important;
            box-shadow: none !important;
          }

          .bac-corner-tl .bac-wave {
            top: -55px !important;
            left: -55px !important;
          }

          .bac-corner-tr .bac-wave {
            top: -55px !important;
            right: -55px !important;
          }

          .bac-corner-bl .bac-wave {
            bottom: -55px !important;
            left: -55px !important;
          }

          .bac-corner-br .bac-wave {
            bottom: -55px !important;
            right: -55px !important;
          }

          .bac-corner-unit .bac-wave-1 {
            animation-delay: ${waveDelay1} !important;
          }

          .bac-corner-unit .bac-wave-2 {
            animation-delay: ${waveDelay2} !important;
          }

          .bac-corner-unit .bac-wave-3 {
            animation-delay: ${waveDelay3} !important;
          }

          /* Keyframe Animations */
          @keyframes bac-corner-acoustic {
            0% {
              transform: scale(0.10);
              opacity: 0;
            }
            20% {
              opacity: 0.90;
            }
            75% {
              opacity: 0.45;
            }
            100% {
              transform: scale(1.25);
              opacity: 0;
            }
          }

          @keyframes bac-halo-breathe {
            0% {
              transform: scale(0.92);
              opacity: 0.70;
            }
            100% {
              transform: scale(1.08);
              opacity: 1;
            }
          }

          @keyframes bac-critical-pulse {
            0%, 100% {
              filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.70)) !important;
              transform: none !important;
            }
            50% {
              filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.95)) !important;
              transform: none !important;
            }
          }

          /* Pure Radar Pulse Animation */
          @keyframes bac-presence-radar-pulse {
            0% {
              box-shadow: 0 0 0 0 var(--radar-color, #f59e0b);
            }
            70% {
              box-shadow: 0 0 0 14px rgba(0, 0, 0, 0);
            }
            100% {
              box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
            }
          }

          @keyframes bac-mesh-breathe {
            0% {
              transform: scale(0.96) translate(-2px, -2px);
              opacity: 0.70;
            }
            50% {
              transform: scale(1.05) translate(3px, 2px);
              opacity: 0.95;
            }
            100% {
              transform: scale(1.01) translate(-1px, 3px);
              opacity: 0.75;
            }
          }
        `;
      } catch (err) {
        console.warn('[Bubble Area Card Warning]', err);
        return '';
      }
    })()}
